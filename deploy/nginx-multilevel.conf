# multilevel.wisar.uz — nginx virtual host (VPS)
# 1) /etc/nginx/sites-available/multilevel.conf ga nusxalang
# 2) ln -s /etc/nginx/sites-available/multilevel.conf /etc/nginx/sites-enabled/
# 3) certbot --nginx -d multilevel.wisar.uz  (SSL uchun)
# 4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name multilevel.wisar.uz;

    client_max_body_size 30m;

    # NestJS API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Yuklangan fayllar (audio va h.k.)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next.js frontend (dizayn bosqichidan keyin ishga tushadi)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
